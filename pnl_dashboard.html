<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crypto Arb Dashboard</title>
<style>
  :root {
    --bg: #f6f7f9;
    --card: #ffffff;
    --border: #e5e7eb;
    --text: #111827;
    --text-dim: #6b7280;
    --accent: #4f46e5;
    --accent2: #06b6d4;
    --green: #059669;
    --red: #dc2626;
    --amber: #d97706;
    --grid: #eef0f3;
    --radius: 14px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Pretendard, Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0d12;
      --card: #14171f;
      --border: #232732;
      --text: #e5e7eb;
      --text-dim: #8b93a3;
      --accent: #818cf8;
      --accent2: #22d3ee;
      --green: #34d399;
      --red: #f87171;
      --amber: #fbbf24;
      --grid: #1c2029;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    padding: 24px 16px 60px;
    line-height: 1.5;
  }
  .wrap { max-width: 960px; margin: 0 auto; }

  header { margin-bottom: 24px; }
  header h1 { font-size: 1.35rem; font-weight: 700; }
  header .updated { color: var(--text-dim); font-size: 0.8rem; margin-top: 4px; }

  .hero {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    margin-bottom: 16px;
  }
  .hero-top { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px; }
  .hero-label { color: var(--text-dim); font-size: 0.85rem; }
  .hero-value { font-size: 2rem; font-weight: 800; letter-spacing: -0.02em; }
  .hero-sub { display: flex; gap: 20px; margin-top: 14px; flex-wrap: wrap; }
  .hero-sub .item { font-size: 0.85rem; }
  .hero-sub .item b { display: block; font-size: 1.05rem; margin-top: 2px; }

  .seed-row {
    display: flex; align-items: baseline; gap: 10px; margin-top: 10px;
    padding-top: 10px; border-top: 1px solid var(--border); flex-wrap: wrap;
  }
  .seed-row .seed-yield { font-size: 1.3rem; font-weight: 800; }
  .seed-row .seed-note { font-size: 0.78rem; color: var(--text-dim); }

  .pos { color: var(--green); }
  .neg { color: var(--red); }
  .neutral { color: var(--text-dim); }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
  @media (max-width: 720px) { .grid2 { grid-template-columns: 1fr; } }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
  }
  .card h2 { font-size: 1rem; font-weight: 700; display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
  .card h3 { font-size: 0.78rem; font-weight: 700; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.04em; margin: 16px 0 8px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .dot.on { background: var(--green); box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.2); }
  .dot.off { background: var(--red); }

  .kv { display: flex; justify-content: space-between; font-size: 0.85rem; padding: 6px 0; border-bottom: 1px dashed var(--border); }
  .kv:last-child { border-bottom: none; }
  .kv .k { color: var(--text-dim); }
  .kv .v { font-weight: 600; font-variant-numeric: tabular-nums; }

  table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 0.8rem; }
  th, td { text-align: right; padding: 6px 4px; border-bottom: 1px solid var(--border); font-variant-numeric: tabular-nums; }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--text-dim); font-weight: 600; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.03em; }
  td.time { color: var(--text-dim); font-size: 0.75rem; }

  .chart-card svg { width: 100%; display: block; overflow: visible; }
  .axis-label { font-size: 9px; fill: var(--text-dim); font-family: var(--font); }
  .grid-line { stroke: var(--grid); stroke-width: 1; }
  .tooltip-dot { opacity: 0; transition: opacity 0.1s; }

  .donut-wrap { display: flex; align-items: center; gap: 20px; }
  .donut-legend { display: flex; flex-direction: column; gap: 10px; font-size: 0.82rem; flex: 1; }
  .legend-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .legend-dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; margin-right: 6px; flex-shrink: 0; }
  .legend-name { display: flex; align-items: center; color: var(--text-dim); }
  .legend-val { font-weight: 700; font-variant-numeric: tabular-nums; }

  .bar-chart { display: flex; align-items: flex-end; gap: 4px; height: 56px; margin: 10px 0 4px; }
  .bar-chart .bar-wrap { flex: 1; display: flex; align-items: flex-end; justify-content: center; height: 100%; }
  .bar-chart .bar { width: 100%; max-width: 22px; border-radius: 3px 3px 0 0; min-height: 3px; }

  .empty { color: var(--text-dim); font-size: 0.82rem; padding: 12px 0; text-align: center; }
  footer { text-align: center; color: var(--text-dim); font-size: 0.75rem; margin-top: 28px; }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Crypto Arb Dashboard</h1>
      <div class="updated" id="updated">로딩 중...</div>
    </header>

    <div class="hero">
      <div class="hero-top">
        <div>
          <div class="hero-label">총 자산 (KRW 환산)</div>
          <div class="hero-value" id="total-asset">-</div>
        </div>
        <div id="daily-pnl-badge"></div>
      </div>
      <div class="seed-row" id="seed-row"></div>
      <div class="hero-sub">
        <div class="item">
          <span class="hero-label">일일 목표</span>
          <b id="target">1.00%</b>
        </div>
        <div class="item">
          <span class="hero-label">오늘 손익</span>
          <b id="daily-pnl">-</b>
        </div>
        <div class="item">
          <span class="hero-label">USD/KRW</span>
          <b id="usd-krw">-</b>
        </div>
      </div>
    </div>

    <div class="grid2">
      <div class="card chart-card">
        <h2>자산 추이</h2>
        <div id="trend-chart"></div>
      </div>
      <div class="card chart-card">
        <h2>자산 배분</h2>
        <div id="allocation-chart"></div>
      </div>
    </div>

    <div class="grid2">
      <div class="card">
        <h2><span class="dot" id="main-dot"></span> 메인봇 <span class="neutral" style="font-weight:400;font-size:0.75rem;">전송 아비트라지</span></h2>
        <div class="kv"><span class="k">보유 자산</span><span class="v" id="main-asset">-</span></div>
        <div class="kv"><span class="k">Bithumb KRW</span><span class="v" id="main-krw">-</span></div>
        <div class="kv"><span class="k">OKX USDT</span><span class="v" id="main-usdt">-</span></div>
        <div class="kv"><span class="k">누적 손익</span><span class="v" id="main-total-pnl">-</span></div>
        <div class="kv"><span class="k">오늘 거래</span><span class="v" id="main-today-trades">-</span></div>
        <h3>최근 거래 손익</h3>
        <div class="bar-chart" id="main-bars"></div>
        <table>
          <thead><tr><th>시각</th><th>코인</th><th>손익($)</th></tr></thead>
          <tbody id="main-trades"></tbody>
        </table>
      </div>

      <div class="card">
        <h2><span class="dot" id="twin-dot"></span> 쌍둥이봇 <span class="neutral" style="font-weight:400;font-size:0.75rem;">양쪽재고 로컬거래</span></h2>
        <div class="kv"><span class="k">보유 자산</span><span class="v" id="twin-asset">-</span></div>
        <div class="kv"><span class="k">XRP (Bithumb)</span><span class="v" id="twin-xrp-b">-</span></div>
        <div class="kv"><span class="k">XRP (OKX)</span><span class="v" id="twin-xrp-o">-</span></div>
        <div class="kv"><span class="k">세션 누적손익</span><span class="v" id="twin-session-pnl">-</span></div>
        <div class="kv"><span class="k">오늘 거래</span><span class="v" id="twin-today-trades">-</span></div>
        <h3>최근 거래 손익</h3>
        <div class="bar-chart" id="twin-bars"></div>
        <table>
          <thead><tr><th>시각</th><th>방향</th><th>손익($)</th></tr></thead>
          <tbody id="twin-trades"></tbody>
        </table>
      </div>
    </div>

    <footer>자동 갱신 · main_bot &amp; twin_bot 실시간 잔고 기준</footer>
  </div>

<script src="logs/pnl_data.js"></script>
<script>
(function() {
  if (typeof pnlData === 'undefined') {
    document.getElementById('updated').textContent = '데이터 로드 실패 (logs/pnl_data.js 확인 필요)';
    return;
  }
  const d = pnlData;
  const fmtKRW = n => n === null || n === undefined ? '-' : Math.round(n).toLocaleString('ko-KR') + '원';
  const fmtKRWShort = n => {
    const abs = Math.abs(n);
    if (abs >= 10000) return (n / 10000).toFixed(1) + '만';
    return Math.round(n).toLocaleString('ko-KR');
  };
  const fmtUSD = n => n === null || n === undefined ? '-' : (n >= 0 ? '+' : '') + n.toFixed(4) + '$';
  const fmtPct = n => n === null || n === undefined ? '-' : (n >= 0 ? '+' : '') + n.toFixed(2) + '%';
  const cls = n => n > 0 ? 'pos' : (n < 0 ? 'neg' : 'neutral');
  const color = n => n > 0 ? 'var(--green)' : (n < 0 ? 'var(--red)' : 'var(--text-dim)');
  const shortTime = t => t ? t.replace('T', ' ').slice(5, 16) : '-';
  const shortDate = ds => { const p = ds.split('-'); return p[1] + '/' + p[2]; };

  document.getElementById('updated').textContent = '업데이트: ' + d.updated_at + ' KST';
  document.getElementById('total-asset').textContent = fmtKRW(d.total_asset_krw);
  document.getElementById('usd-krw').textContent = d.usd_krw.toLocaleString('ko-KR');
  document.getElementById('target').textContent = d.target_daily_yield_pct.toFixed(2) + '%';

  if (d.seed) {
    const s = d.seed;
    document.getElementById('seed-row').innerHTML =
      '<span class="seed-yield ' + cls(s.seed_yield_pct) + '">' + fmtPct(s.seed_yield_pct) + '</span>' +
      '<span class="seed-note">원금 대비 누적 (' + fmtKRW(s.seed_krw) + ', ' + s.seed_date + ' 기준 · ' + s.days_since_seed + '일 경과)</span>' +
      '<span class="seed-note" style="margin-left:auto;">손익 ' + fmtKRW(s.seed_pnl_krw) + ' · 일평균 ' + fmtPct(s.avg_daily_yield_pct) + '</span>';
  }

  const dp = document.getElementById('daily-pnl');
  const badge = document.getElementById('daily-pnl-badge');
  if (d.daily_pnl_krw !== null) {
    dp.textContent = fmtKRW(d.daily_pnl_krw);
    dp.className = cls(d.daily_pnl_krw);
    const met = d.daily_yield_pct >= d.target_daily_yield_pct;
    badge.innerHTML = '<span class="' + (met ? 'pos' : 'neutral') + '" style="font-size:0.85rem;font-weight:700;">' +
      (met ? '✓ 목표 달성 ' : '') + fmtPct(d.daily_yield_pct) + '</span>';
  } else {
    dp.textContent = '데이터 축적 중';
    dp.className = 'neutral';
  }

  const mb = d.bots.main_bot, tb = d.bots.twin_bot;

  document.getElementById('main-dot').className = 'dot ' + (mb.running ? 'on' : 'off');
  document.getElementById('main-asset').textContent = fmtKRW(mb.asset_krw);
  document.getElementById('main-krw').textContent = fmtKRW(mb.balance_krw);
  document.getElementById('main-usdt').textContent = '$' + mb.balance_usdt.toFixed(2);
  const mtp = document.getElementById('main-total-pnl');
  mtp.textContent = fmtUSD(mb.total_pnl_usd); mtp.className = 'v ' + cls(mb.total_pnl_usd);
  document.getElementById('main-today-trades').textContent = mb.today_trades + '건 (' + fmtUSD(mb.today_pnl_usd) + ')';

  const mtBody = document.getElementById('main-trades');
  if (mb.recent_trades.length === 0) {
    mtBody.innerHTML = '<tr><td colspan="3" class="empty">거래 이력 없음</td></tr>';
  } else {
    mb.recent_trades.forEach(t => {
      const tr = document.createElement('tr');
      tr.innerHTML = '<td class="time">' + shortTime(t.time) + '</td><td>' + t.coin +
        '</td><td class="' + cls(t.profit_usd) + '">' + fmtUSD(t.profit_usd) + '</td>';
      mtBody.appendChild(tr);
    });
  }

  document.getElementById('twin-dot').className = 'dot ' + (tb.running ? 'on' : 'off');
  document.getElementById('twin-asset').textContent = fmtKRW(tb.asset_krw);
  document.getElementById('twin-xrp-b').textContent = tb.xrp_bithumb.toFixed(4) + ' XRP';
  document.getElementById('twin-xrp-o').textContent = tb.xrp_okx.toFixed(4) + ' XRP';
  const tsp = document.getElementById('twin-session-pnl');
  tsp.textContent = fmtUSD(tb.session_pnl_usd); tsp.className = 'v ' + cls(tb.session_pnl_usd);
  document.getElementById('twin-today-trades').textContent = tb.today_trades + '건 (' + fmtUSD(tb.today_pnl_usd) + ')';

  const ttBody = document.getElementById('twin-trades');
  if (tb.recent_trades.length === 0) {
    ttBody.innerHTML = '<tr><td colspan="3" class="empty">거래 이력 없음</td></tr>';
  } else {
    tb.recent_trades.forEach(t => {
      const tr = document.createElement('tr');
      tr.innerHTML = '<td class="time">' + shortTime(t.time) + '</td><td>' + (t.sell_side === 'BITHUMB' ? '빗썸매도' : 'OKX매도') +
        '</td><td class="' + cls(t.pnl_usd) + '">' + fmtUSD(t.pnl_usd) + '</td>';
      ttBody.appendChild(tr);
    });
  }

  // ---------------------------------------------------------------
  // 거래별 손익 막대그래프 (최근 거래를 시간순으로, 최대 8건)
  // ---------------------------------------------------------------
  function renderBarChart(containerId, trades, valueKey) {
    const el = document.getElementById(containerId);
    const items = trades.slice(0, 8).reverse();
    if (items.length === 0) {
      el.innerHTML = '<div class="empty" style="height:56px;display:flex;align-items:center;justify-content:center;">거래 없음</div>';
      return;
    }
    const vals = items.map(t => t[valueKey]);
    const maxAbs = Math.max(...vals.map(Math.abs), 0.0001);
    el.innerHTML = items.map(t => {
      const v = t[valueKey];
      const pct = Math.max(Math.abs(v) / maxAbs * 100, 6);
      return '<div class="bar-wrap" title="' + fmtUSD(v) + '">' +
        '<div class="bar" style="height:' + pct + '%;background:' + color(v) + ';"></div>' +
        '</div>';
    }).join('');
  }
  renderBarChart('main-bars', mb.recent_trades, 'profit_usd');
  renderBarChart('twin-bars', tb.recent_trades, 'pnl_usd');

  // ---------------------------------------------------------------
  // 자산 추이 차트 (그리드 + 축 라벨 + 영역채우기 + 호버 툴팁)
  // ---------------------------------------------------------------
  (function renderTrend() {
    const trend = d.asset_trend || [];
    const container = document.getElementById('trend-chart');
    if (trend.length < 2) {
      const cur = trend.length === 1 ? fmtKRW(trend[0].total_krw) : '-';
      container.innerHTML = '<div class="empty" style="padding:30px 0;">추이 데이터 축적 중 (매일 자동 기록)<br>' +
        '<span style="font-size:1.1rem;font-weight:700;color:var(--text);">' + cur + '</span></div>';
      return;
    }
    const vals = trend.map(p => p.total_krw);
    const min = Math.min(...vals), max = Math.max(...vals);
    const range = (max - min) || max * 0.05 || 1;
    const padMin = min - range * 0.15, padMax = max + range * 0.15;
    const fullRange = padMax - padMin;

    const W = 560, H = 180, padL = 46, padR = 10, padT = 12, padB = 22;
    const plotW = W - padL - padR, plotH = H - padT - padB;

    const xAt = i => padL + (trend.length === 1 ? plotW / 2 : (i / (trend.length - 1)) * plotW);
    const yAt = v => padT + plotH - ((v - padMin) / fullRange) * plotH;

    const linePts = vals.map((v, i) => xAt(i) + ',' + yAt(v)).join(' ');
    const areaPts = linePts + ' ' + xAt(vals.length - 1) + ',' + (padT + plotH) + ' ' + xAt(0) + ',' + (padT + plotH);

    const isUp = vals[vals.length - 1] >= vals[0];
    const lineColor = isUp ? 'var(--green)' : 'var(--red)';

    // 그리드라인 4단 + Y축 라벨
    let gridSvg = '';
    const steps = 4;
    for (let s = 0; s <= steps; s++) {
      const v = padMin + (fullRange * s / steps);
      const y = yAt(v);
      gridSvg += '<line class="grid-line" x1="' + padL + '" y1="' + y + '" x2="' + (W - padR) + '" y2="' + y + '" />';
      gridSvg += '<text class="axis-label" x="' + (padL - 6) + '" y="' + (y + 3) + '" text-anchor="end">' + fmtKRWShort(v) + '</text>';
    }

    // X축 날짜 라벨 (최대 6개, 균등 샘플)
    let xLabelsSvg = '';
    const labelCount = Math.min(trend.length, 6);
    for (let k = 0; k < labelCount; k++) {
      const idx = labelCount === 1 ? 0 : Math.round(k * (trend.length - 1) / (labelCount - 1));
      xLabelsSvg += '<text class="axis-label" x="' + xAt(idx) + '" y="' + (H - 4) + '" text-anchor="middle">' + shortDate(trend[idx].date) + '</text>';
    }

    // 데이터 포인트 + 호버 대상 원
    let dotsSvg = '';
    vals.forEach((v, i) => {
      dotsSvg += '<circle cx="' + xAt(i) + '" cy="' + yAt(v) + '" r="3" fill="' + lineColor + '" />';
      dotsSvg += '<circle class="hover-target" data-idx="' + i + '" cx="' + xAt(i) + '" cy="' + yAt(v) + '" r="10" fill="transparent" style="cursor:pointer;" />';
    });

    const svgId = 'trend-svg-el';
    const tipId = 'trend-tip';
    container.innerHTML =
      '<svg id="' + svgId + '" viewBox="0 0 ' + W + ' ' + H + '" style="height:' + H + 'px;">' +
        '<defs><linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">' +
          '<stop offset="0%" stop-color="' + lineColor + '" stop-opacity="0.25" />' +
          '<stop offset="100%" stop-color="' + lineColor + '" stop-opacity="0" />' +
        '</linearGradient></defs>' +
        gridSvg +
        '<polygon points="' + areaPts + '" fill="url(#areaGrad)" />' +
        '<polyline points="' + linePts + '" fill="none" stroke="' + lineColor + '" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" />' +
        dotsSvg +
        xLabelsSvg +
      '</svg>' +
      '<div id="' + tipId + '" style="display:none;position:relative;text-align:center;font-size:0.78rem;color:var(--text-dim);margin-top:2px;"></div>';

    const tip = document.getElementById(tipId);
    container.querySelectorAll('.hover-target').forEach(el => {
      el.addEventListener('mouseenter', () => {
        const i = +el.getAttribute('data-idx');
        tip.style.display = 'block';
        tip.innerHTML = '<b style="color:var(--text);">' + trend[i].date + '</b> · ' + fmtKRW(trend[i].total_krw);
      });
      el.addEventListener('mouseleave', () => { tip.style.display = 'none'; });
    });
  })();

  // ---------------------------------------------------------------
  // 자산 배분 도넛차트 (main_bot vs twin_bot)
  // ---------------------------------------------------------------
  (function renderAllocation() {
    const container = document.getElementById('allocation-chart');
    const total = mb.asset_krw + tb.asset_krw;
    if (total <= 0) {
      container.innerHTML = '<div class="empty">데이터 없음</div>';
      return;
    }
    const mainPct = mb.asset_krw / total * 100;
    const twinPct = tb.asset_krw / total * 100;
    const R = 52, CX = 60, CY = 60, STROKE = 16;
    const CIRC = 2 * Math.PI * R;
    const mainLen = CIRC * mainPct / 100;
    const twinLen = CIRC * twinPct / 100;

    const svg =
      '<svg viewBox="0 0 120 120" style="width:130px;height:130px;flex-shrink:0;">' +
        '<circle cx="' + CX + '" cy="' + CY + '" r="' + R + '" fill="none" stroke="var(--grid)" stroke-width="' + STROKE + '" />' +
        '<circle cx="' + CX + '" cy="' + CY + '" r="' + R + '" fill="none" stroke="var(--accent)" stroke-width="' + STROKE + '" ' +
          'stroke-dasharray="' + mainLen + ' ' + CIRC + '" stroke-dashoffset="0" transform="rotate(-90 ' + CX + ' ' + CY + ')" stroke-linecap="round" />' +
        '<circle cx="' + CX + '" cy="' + CY + '" r="' + R + '" fill="none" stroke="var(--accent2)" stroke-width="' + STROKE + '" ' +
          'stroke-dasharray="' + twinLen + ' ' + CIRC + '" stroke-dashoffset="-' + mainLen + '" transform="rotate(-90 ' + CX + ' ' + CY + ')" stroke-linecap="round" />' +
        '<text x="' + CX + '" y="' + (CY - 4) + '" text-anchor="middle" style="font-size:15px;font-weight:800;fill:var(--text);">' + Math.round(mainPct) + '%</text>' +
        '<text x="' + CX + '" y="' + (CY + 12) + '" text-anchor="middle" style="font-size:9px;fill:var(--text-dim);">메인봇</text>' +
      '</svg>';

    const legend =
      '<div class="donut-legend">' +
        '<div class="legend-row"><span class="legend-name"><span class="legend-dot" style="background:var(--accent);"></span>메인봇</span><span class="legend-val">' + fmtKRW(mb.asset_krw) + '</span></div>' +
        '<div class="legend-row"><span class="legend-name"><span class="legend-dot" style="background:var(--accent2);"></span>쌍둥이봇</span><span class="legend-val">' + fmtKRW(tb.asset_krw) + '</span></div>' +
        '<div class="legend-row" style="border-top:1px dashed var(--border);padding-top:8px;margin-top:2px;"><span class="legend-name">합계</span><span class="legend-val">' + fmtKRW(total) + '</span></div>' +
      '</div>';

    container.innerHTML = '<div class="donut-wrap">' + svg + legend + '</div>';
  })();
})();
</script>
</body>
</html>
