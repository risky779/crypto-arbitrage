<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crypto Arb Dashboard</title>
<style>
  :root {
    --bg: #f6f7f9;
    --card: #ffffff;
    --border: #e5e7eb;
    --text: #111827;
    --text-dim: #6b7280;
    --accent: #4f46e5;
    --green: #059669;
    --red: #dc2626;
    --grid: #eef0f3;
    --radius: 14px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Pretendard, Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0d12;
      --card: #14171f;
      --border: #232732;
      --text: #e5e7eb;
      --text-dim: #8b93a3;
      --accent: #818cf8;
      --green: #34d399;
      --red: #f87171;
      --grid: #1c2029;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--font); padding: 24px 16px 60px; line-height: 1.5; }
  .wrap { max-width: 720px; margin: 0 auto; }
  header { margin-bottom: 24px; }
  header h1 { font-size: 1.35rem; font-weight: 700; }
  header .updated { color: var(--text-dim); font-size: 0.8rem; margin-top: 4px; }

  .hero { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; margin-bottom: 16px; }
  .hero-label { color: var(--text-dim); font-size: 0.85rem; }
  .hero-value { font-size: 2rem; font-weight: 800; letter-spacing: -0.02em; }
  .seed-row { display: flex; align-items: baseline; gap: 10px; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); flex-wrap: wrap; }
  .seed-row .seed-yield { font-size: 1.3rem; font-weight: 800; }
  .seed-row .seed-note { font-size: 0.78rem; color: var(--text-dim); }
  .hero-sub { display: flex; gap: 20px; margin-top: 14px; flex-wrap: wrap; }
  .hero-sub .item { font-size: 0.85rem; }
  .hero-sub .item b { display: block; font-size: 1.05rem; margin-top: 2px; }

  .pos { color: var(--green); }
  .neg { color: var(--red); }
  .neutral { color: var(--text-dim); }

  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; }
  .card h2 { font-size: 1rem; font-weight: 700; display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .dot.on { background: var(--green); box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.2); }
  .dot.off { background: var(--red); }

  .kv { display: flex; justify-content: space-between; font-size: 0.85rem; padding: 6px 0; border-bottom: 1px dashed var(--border); }
  .kv:last-child { border-bottom: none; }
  .kv .k { color: var(--text-dim); }
  .kv .v { font-weight: 600; font-variant-numeric: tabular-nums; }

  table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 0.8rem; }
  th, td { text-align: right; padding: 6px 4px; border-bottom: 1px solid var(--border); font-variant-numeric: tabular-nums; }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--text-dim); font-weight: 600; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.03em; }
  td.time { color: var(--text-dim); font-size: 0.75rem; }

  .chart-card svg { width: 100%; display: block; overflow: visible; }
  .axis-label { font-size: 9px; fill: var(--text-dim); font-family: var(--font); }
  .grid-line { stroke: var(--grid); stroke-width: 1; }

  .empty { color: var(--text-dim); font-size: 0.82rem; padding: 12px 0; text-align: center; }
  footer { text-align: center; color: var(--text-dim); font-size: 0.75rem; margin-top: 28px; }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Crypto Arb Dashboard</h1>
      <div class="updated" id="updated">로딩 중...</div>
    </header>

    <div class="hero">
      <div class="hero-label">총 자산 (KRW 환산, 빗썸+OKX 실측)</div>
      <div class="hero-value" id="total-asset">-</div>
      <div class="seed-row" id="seed-row"></div>
      <div class="hero-sub">
        <div class="item"><span class="hero-label">초기 원금</span><b id="seed-krw">-</b></div>
        <div class="item"><span class="hero-label">USD/KRW</span><b id="usd-krw">-</b></div>
      </div>
    </div>

    <div class="card chart-card">
      <h2>일별 총자산 추이</h2>
      <div id="trend-chart"></div>
    </div>

    <div class="card">
      <h2><span class="dot" id="ph-dot"></span> <span id="ph-label">현선봇</span></h2>
      <div class="kv"><span class="k">현물 보유가치</span><span class="v" id="ph-spot">-</span></div>
      <div class="kv"><span class="k">선물 미실현손익</span><span class="v" id="ph-upnl">-</span></div>
      <div class="kv"><span class="k">누적 실현손익 (전체기간)</span><span class="v" id="ph-realized">-</span></div>
      <h3 style="font-size:0.78rem;color:var(--text-dim);margin:16px 0 8px;">최근 이벤트</h3>
      <table>
        <thead><tr><th>시각</th><th>코인</th><th>종류</th><th>갭/손익</th></tr></thead>
        <tbody id="ph-events"></tbody>
      </table>
    </div>

    <footer>자동 갱신 · 빗썸+OKX 실시간 잔고 기준</footer>
  </div>

<script src="logs/pnl_data.js"></script>
<script>
(function() {
  if (typeof pnlData === 'undefined') {
    document.getElementById('updated').textContent = '데이터 로드 실패 (logs/pnl_data.js 확인 필요)';
    return;
  }
  const d = pnlData;
  const fmtKRW = n => n === null || n === undefined ? '-' : Math.round(n).toLocaleString('ko-KR') + '원';
  const fmtKRWShort = n => {
    const abs = Math.abs(n);
    if (abs >= 10000) return (n / 10000).toFixed(1) + '만';
    return Math.round(n).toLocaleString('ko-KR');
  };
  const fmtUSD = n => n === null || n === undefined ? '-' : (n >= 0 ? '+' : '') + n.toFixed(4) + '$';
  const fmtPct = n => n === null || n === undefined ? '-' : (n >= 0 ? '+' : '') + n.toFixed(2) + '%';
  const cls = n => n > 0 ? 'pos' : (n < 0 ? 'neg' : 'neutral');
  const shortTime = t => t ? t.replace('T', ' ').slice(5, 16) : '-';
  const shortDate = ds => { const p = ds.split('-'); return p[1] + '/' + p[2]; };

  document.getElementById('updated').textContent = '업데이트: ' + d.updated_at + ' KST';
  document.getElementById('total-asset').textContent = fmtKRW(d.total_asset_krw);
  document.getElementById('usd-krw').textContent = d.usd_krw.toLocaleString('ko-KR');

  if (d.seed) {
    const s = d.seed;
    document.getElementById('seed-krw').textContent = fmtKRW(s.seed_krw) + ' (' + s.seed_date + ')';
    document.getElementById('seed-row').innerHTML =
      '<span class="seed-yield ' + cls(s.seed_yield_pct) + '">' + fmtPct(s.seed_yield_pct) + '</span>' +
      '<span class="seed-note">원금 대비 누적 (' + s.days_since_seed + '일 경과)</span>' +
      '<span class="seed-note" style="margin-left:auto;">손익 ' + fmtKRW(s.seed_pnl_krw) + ' · 일평균 ' + fmtPct(s.avg_daily_yield_pct) + '</span>';
  }

  const ph = d.perp_hedge_bot;
  if (ph) {
    document.getElementById('ph-label').textContent = ph.label || '현선봇';
    document.getElementById('ph-dot').className = 'dot ' + (ph.running ? 'on' : 'off');
    document.getElementById('ph-spot').textContent = fmtKRW(ph.spot_krw);
    const u = document.getElementById('ph-upnl');
    u.textContent = fmtUSD(ph.hedge_upnl_usd);
    u.className = 'v ' + cls(ph.hedge_upnl_usd);
    const r = document.getElementById('ph-realized');
    r.textContent = fmtUSD(ph.realized_usd_alltime) + ' (' + fmtKRW(ph.realized_krw_alltime) + ')';
    r.className = 'v ' + cls(ph.realized_usd_alltime);

    const body = document.getElementById('ph-events');
    const events = ph.recent_events || [];
    if (events.length === 0) {
      body.innerHTML = '<tr><td colspan="4" class="empty">이벤트 없음</td></tr>';
    } else {
      body.innerHTML = events.map(e => {
        const isClose = e.kind === 'CLOSE';
        const val = isClose ? fmtUSD(e.pnl_usd) : (e.gap_pct !== null && e.gap_pct !== undefined ? fmtPct(e.gap_pct) : '-');
        const valCls = isClose ? cls(e.pnl_usd) : 'neutral';
        return '<tr><td class="time">' + shortTime(e.time) + '</td><td>' + e.coin + '</td>' +
          '<td>' + (isClose ? '청산' : '진입') + '</td>' +
          '<td class="' + valCls + '">' + val + '</td></tr>';
      }).join('');
    }
  }

  (function renderTrend() {
    const hist = d.asset_trend || [];
    const container = document.getElementById('trend-chart');
    if (hist.length < 2) {
      container.innerHTML = '<div class="empty" style="padding:30px 0;">데이터 축적 중 (매 실행마다 오늘자 자산 기록)</div>';
      return;
    }
    const vals = hist.map(p => p.total_krw);
    const min = Math.min(...vals), max = Math.max(...vals);
    const range = (max - min) || Math.abs(max) * 0.1 || 1;
    const padMin = min - range * 0.1, padMax = max + range * 0.1;
    const fullRange = padMax - padMin;

    const W = 560, H = 180, padL = 50, padR = 10, padT = 12, padB = 22;
    const plotW = W - padL - padR, plotH = H - padT - padB;
    const xAt = i => padL + (hist.length === 1 ? plotW / 2 : (i / Math.max(hist.length - 1, 1)) * plotW);
    const yAt = v => padT + plotH - ((v - padMin) / fullRange) * plotH;

    let gridSvg = '';
    const steps = 4;
    for (let s = 0; s <= steps; s++) {
      const v = padMin + (fullRange * s / steps);
      const y = yAt(v);
      gridSvg += '<line class="grid-line" x1="' + padL + '" y1="' + y + '" x2="' + (W - padR) + '" y2="' + y + '" />';
      gridSvg += '<text class="axis-label" x="' + (padL - 6) + '" y="' + (y + 3) + '" text-anchor="end">' + fmtKRWShort(v) + '</text>';
    }
    let xLabelsSvg = '';
    const labelCount = Math.min(hist.length, 6);
    for (let k = 0; k < labelCount; k++) {
      const idx = labelCount === 1 ? 0 : Math.round(k * (hist.length - 1) / (labelCount - 1));
      xLabelsSvg += '<text class="axis-label" x="' + xAt(idx) + '" y="' + (H - 4) + '" text-anchor="middle">' + shortDate(hist[idx].date) + '</text>';
    }
    const path = vals.map((v, i) => (i === 0 ? 'M' : 'L') + xAt(i) + ' ' + yAt(v)).join(' ');
    const lineSvg = '<path d="' + path + '" fill="none" stroke="var(--accent)" stroke-width="2.2" />';

    let hoverSvg = '';
    const barSlot = hist.length === 1 ? plotW : plotW / hist.length;
    hist.forEach((_, i) => {
      hoverSvg += '<rect class="hover-target" data-idx="' + i + '" x="' + (xAt(i) - barSlot / 2) + '" y="' + padT + '" width="' + barSlot + '" height="' + plotH + '" fill="transparent" style="cursor:pointer;" />';
    });

    container.innerHTML =
      '<svg viewBox="0 0 ' + W + ' ' + H + '" style="height:' + H + 'px;">' + gridSvg + lineSvg + hoverSvg + xLabelsSvg + '</svg>' +
      '<div id="trend-tip" style="display:none;text-align:center;font-size:0.78rem;color:var(--text-dim);margin-top:2px;"></div>';

    const tip = document.getElementById('trend-tip');
    container.querySelectorAll('.hover-target').forEach(el => {
      el.addEventListener('mouseenter', () => {
        const i = +el.getAttribute('data-idx');
        tip.style.display = 'block';
        tip.innerHTML = '<b style="color:var(--text);">' + hist[i].date + '</b> · ' + fmtKRW(hist[i].total_krw);
      });
      el.addEventListener('mouseleave', () => { tip.style.display = 'none'; });
    });
  })();
})();
</script>
</body>
</html>
